version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cyber_threat_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber_threat_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "AI Cybersecurity Threat Detection & Response System"
      APP_ENV: production
      DEBUG: "false"
      API_PREFIX: /api/v1
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env using the Compose database host}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber_threat_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
